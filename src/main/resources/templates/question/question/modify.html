<html layout:decorate="~{layout}">

<head>
    <title th:text="|${question.id}번 질문 수정 - ${question.subject}|"></title>
</head>

<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">질문수정</h5>
    <form method="POST" th:action th:object="${form}">
        <input type="hidden" name="_method" value="PUT">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text" th:field="*{subject}" class="form-control" autofocus>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10"></textarea>
        </div>
        <input type="submit" value="수정하기" class="btn btn-primary my-2">
        <a th:href="@{|/questions/${question.id}|}" class="btn btn-outline-secondary my-2">취소</a>
    </form>
</div>

</html>
