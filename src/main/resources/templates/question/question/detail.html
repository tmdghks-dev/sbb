<html layout:decorate="~{layout}">

<head>
    <title th:text="|${question.id}번 질문 - ${question.subject}|"></title>
</head>

<div layout:fragment="content" class="container my-3">
    <!-- 질문 -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
    <div class="card my-3">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${question.content}"></div>
            <div class="d-flex justify-content-end">
                <!-- 작성 직후에는 createDate 와 modifyDate 가 같으므로, 수정했을 때만 표시 -->
                <div th:if="${question.modifyDate != null and question.modifyDate.isAfter(question.createDate)}"
                     class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${question.author?.username}"></div>
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3" sec:authorize="isAuthenticated()"
                 th:if="${question.author != null and #authentication.name == question.author.username}">
                <a th:href="@{|/questions/${question.id}/modify|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <a method="DELETE" th:href="@{|/questions/${question.id}/delete|}"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">삭제</a>
            </div>
        </div>
    </div>
    <!-- 답변의 갯수 표시 -->
    <h5 class="border-bottom my-3 py-2"
        th:text="|${#lists.size(question.answers)}개의 답변이 있습니다.|"></h5>
    <!-- 답변 반복 시작 -->
    <div class="card my-3" th:each="answer : ${question.answers}">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${answer.content}"></div>
            <div class="d-flex justify-content-end">
                <div th:if="${answer.modifyDate != null and answer.modifyDate.isAfter(answer.createDate)}"
                     class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${answer.author?.username}"></div>
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3" sec:authorize="isAuthenticated()"
                 th:if="${answer.author != null and #authentication.name == answer.author.username}">
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}/modify|}"
                   class="btn btn-sm btn-outline-secondary">수정</a>
                <a method="DELETE" th:href="@{|/questions/${question.id}/answers/${answer.id}/delete|}"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">삭제</a>
            </div>
        </div>
    </div>
    <!-- 답변 반복 끝  -->
    <!-- 답변 작성 -->
    <script>
        function Answer__submitWriteForm(form) {
            form.content.value = form.content.value.trim();

            if (form.content.value.length === 0) {
                alert("답변 내용을 입력해주세요.");
                form.content.focus();

                return;
            }

            form.submit();
        }
    </script>
    <form th:action="@{|/questions/${question.id}/answers/write|}" method="POST" class="my-3"
          onsubmit="Answer__submitWriteForm(this); return false;">
        <textarea name="content" id="content" rows="10" class="form-control"></textarea>
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>
</div>

</html>
